description: >-
  <p>Main statistical charts, all built with <b>ggplot2</b> and offering
  extensive customization options:</p> <ul> <li><strong>Continuous
  variables</strong>: Histogram, Box plot, Raincloud plot, Scatter plot, Error
  bar chart, Lollipop plot, QQ plot</li> <li><strong>Categorical
  variables</strong>: Bar plot, Pie chart, Mosaic plot, Likert plot</li>
  <li><strong>Time series</strong>: Line chart, Area chart</li>
  <li><strong>Multiple Response</strong>: Frequencies, Crosstab</li> </ul>
  <p><strong>Main classic multivariate data analyses</strong> are also
  available:</p> <ul> <li>Principal Component Analysis</li> <li>Correspondence
  Analysis</li> <li>Multiple Correspondence Analysis</li> </ul> <p>The module is
  available in the <strong>Plots</strong> tab.</p> <p>Project source (and
  changelog) is available at <a href="https://github.com/vjalby/vijPlots"
  target="_blank">Github</a>.</p>
