title: Likert Plot
name: likertplot
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Likert Variables
        children:
          - type: VariablesListBox
            name: liks
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Data
            children:
              - type: CheckBox
                name: tidyUp
              - type: CheckBox
                name: toInteger
              - type: CheckBox
                name: ignoreNA
                enable: (!(!group))
              - type: CheckBox
                name: descAsVarName
      - type: LayoutBox
        cell:
          column: 2
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Sort Variables
            children:
              - type: RadioButton
                name: sorting_none
                optionName: sorting
                optionPart: none
              - type: RadioButton
                name: sorting_descending
                optionName: sorting
                optionPart: descending
              - type: RadioButton
                name: sorting_ascending
                optionName: sorting
                optionPart: ascending
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Group By
            children:
              - type: RadioButton
                name: groupBy_variable
                optionName: groupBy
                optionPart: variable
                enable: (!(!group))
              - type: RadioButton
                name: groupBy_group
                optionName: groupBy
                optionPart: group
                enable: (!(!group))
  - type: CollapseBox
    label: Table
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Table
                children:
                  - type: CheckBox
                    name: frequencyTable
                  - type: CheckBox
                    name: showMedian
                    enable: (frequencyTable)
                  - type: CheckBox
                    name: showMean
                    enable: (frequencyTable)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Frequency Type
                children:
                  - type: RadioButton
                    name: frequencies_counts
                    optionName: frequencies
                    optionPart: counts
                    enable: (frequencyTable)
                  - type: RadioButton
                    name: frequencies_percentages
                    optionName: frequencies
                    optionPart: percentages
                    enable: (frequencyTable)
  - type: CollapseBox
    label: Comparison Tests
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Tests
                children:
                  - type: CheckBox
                    name: showMannU
                    enable: (!(!group))
                  - type: CheckBox
                    name: showKW
                    enable: (!(!group))
                  - type: CheckBox
                    name: showPostHoc
                    enable: (!(!group))
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Post Hoc Tests
                children:
                  - type: RadioButton
                    name: postHoc_dunn
                    optionName: postHoc
                    optionPart: dunn
                    enable: (!(!group) && showPostHoc)
                  - type: RadioButton
                    name: postHoc_conover
                    optionName: postHoc
                    optionPart: conover
                    enable: (!(!group) && showPostHoc)
                  - type: RadioButton
                    name: postHoc_dscf
                    optionName: postHoc
                    optionPart: dscf
                    enable: (!(!group) && showPostHoc)
          - type: LayoutBox
            cell:
              column: 2
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: p-Value Adjustment
                children:
                  - type: RadioButton
                    name: pValue_none
                    optionName: pValue
                    optionPart: none
                    enable: (!(!group) && (showKW || showMannU || showPostHoc))
                  - type: RadioButton
                    name: pValue_group
                    optionName: pValue
                    optionPart: group
                    enable: (!(!group) && showPostHoc)
                  - type: RadioButton
                    name: pValue_overall
                    optionName: pValue
                    optionPart: overall
                    enable: (!(!group) && (showKW || showMannU || showPostHoc))
              - type: ComboBox
                name: adjustMethod
                enable: (!(!group) && (pValue_group || pValue_overall) && (showKW || showMannU || showPostHoc))
  - type: CollapseBox
    label: Plot
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Type
                children:
                  - type: RadioButton
                    name: type_stacked
                    optionName: type
                    optionPart: stacked
                  - type: RadioButton
                    name: type_centered
                    optionName: type
                    optionPart: centered
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Options
                children:
                  - type: CheckBox
                    name: addMedianLine
                    enable: (type_stacked)
                  - type: CheckBox
                    name: reverseLikert
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: '% Labels'
                children:
                  - type: CheckBox
                    name: addLabels
                  - type: CheckBox
                    name: hideLabelsBelow
                    enable: (addLabels)
                  - type: CheckBox
                    name: addTotals
                    enable: (type_centered)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: '% Accuracy'
                children:
                  - type: RadioButton
                    name: accuracy_1
                    optionName: accuracy
                    optionPart: '1'
                  - type: RadioButton
                    name: accuracy_01
                    optionName: accuracy
                    optionPart: '0.1'
                  - type: RadioButton
                    name: accuracy_001
                    optionName: accuracy
                    optionPart: '0.01'
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Label Size
                children:
                  - type: ComboBox
                    name: hLabelWrap
                  - type: ComboBox
                    name: vLabelWrap
                    enable: (!(!group))
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Plot Color
                children:
                  - type: ComboBox
                    name: plotColor
                  - type: ComboBox
                    name: labelColor
                    enable: (addLabels)
  - type: CollapseBox
    label: Text Size
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Text Size
                children:
                  - type: TextBox
                    name: labelSize
                    format: number
                    enable: ((type_stacked && addLabels) || (type_centered && (addLabels || addTotals)))
                  - type: TextBox
                    name: groupSize
                    format: number
                    enable: (!(!group))
  - type: CollapseBox
    label: Axes
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: X-Axis
                children:
                  - type: TextBox
                    name: xAxisLabelFontSize
                    format: number
                  - type: TextBox
                    name: xAxisLabelRotation
                    suffix: "°"
                    format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Y-Axis
                children:
                  - type: TextBox
                    name: yAxisLabelFontSize
                    format: number
                  - type: TextBox
                    name: yAxisLabelRotation
                    suffix: "°"
                    format: number
  - type: CollapseBox
    label: Legend Title
    collapsed: true
    stretchFactor: 1
    children:
      - type: Label
        label: Legend
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            style: inline
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: legendText
                    format: string
                    width: largest
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: legendFontSize
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: legendPosition
  - type: CollapseBox
    label: Plot Titles
    collapsed: true
    stretchFactor: 1
    children:
      - type: Label
        label: Title
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            style: inline
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: titleText
                    format: string
                    width: largest
              - type: LayoutBox
                margin: large
                style: inline
                children:
                  - type: ComboBox
                    name: titleFontFace
                  - type: ComboBox
                    name: titleFontSize
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: titleAlign
      - type: Label
        label: Subtitle
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            style: inline
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: subtitleText
                    format: string
                    width: largest
              - type: LayoutBox
                margin: large
                style: inline
                children:
                  - type: ComboBox
                    name: subtitleFontFace
                  - type: ComboBox
                    name: subtitleFontSize
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: subtitleAlign
      - type: Label
        label: Caption
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            style: inline
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: captionText
                    format: string
                    width: largest
              - type: LayoutBox
                margin: large
                style: inline
                children:
                  - type: ComboBox
                    name: captionFontFace
                  - type: ComboBox
                    name: captionFontSize
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: captionAlign
